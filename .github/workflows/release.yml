name: Publish Kurisu Codex Pet

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, e.g. v1.0.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build flat one-click package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ZIP="Kurisu-CodexPet-${VERSION}-OneClick.zip"
          SRC="outputs/kurisu_pet"

          test -f "$SRC/install.bat"
          test -f "$SRC/pet.json"
          test -f "$SRC/spritesheet.webp"

          rm -rf release-package
          mkdir -p release-package
          cp "$SRC/install.bat" release-package/install.bat
          cp "$SRC/pet.json" release-package/pet.json
          cp "$SRC/spritesheet.webp" release-package/spritesheet.webp

          cd release-package
          zip -9 -r "../$ZIP" install.bat pet.json spritesheet.webp >/dev/null
          cd ..

          FILES=$(unzip -Z1 "$ZIP" | sort)
          EXPECTED=$(printf '%s\n' 'install.bat' 'pet.json' 'spritesheet.webp' | sort)
          if [ "$FILES" != "$EXPECTED" ]; then
            echo "Unexpected files found in release package."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$VERSION"
          ZIP="Kurisu-CodexPet-${VERSION}-OneClick.zip"

          cat > RELEASE_NOTES.md <<EOF
          ## Kurisu Codex Pet ${VERSION} — One-click installer

          ### 一键安装
          1. 下载 \`${ZIP}\`。
          2. 解压。
          3. 双击 \`install.bat\`。
          4. 自动安装到 \`%USERPROFILE%\\.codex\\pets\\kurisu\`。
          5. 重启 Codex Desktop 或刷新 Pets，然后选择 **Kurisu / 牧濑红莉栖**。

          ZIP 解压后只有三个文件：\`install.bat\`、\`pet.json\`、\`spritesheet.webp\`。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --title "Kurisu Codex Pet ${VERSION} - One-click installer" \
              --notes-file RELEASE_NOTES.md \
              --target "$GITHUB_SHA"
          fi
