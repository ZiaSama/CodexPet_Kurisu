name: Publish Kurisu Codex Pet v1.0.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.0.1.yml
      - packaging/install.bat

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build one-click install package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Kurisu-CodexPet-v1.0.1-OneClick.zip"

          test -f outputs/kurisu_pet/pet.json
          test -f outputs/kurisu_pet/spritesheet.webp
          test -f packaging/install.bat

          rm -rf release-package
          mkdir -p release-package/kurisu
          cp packaging/install.bat release-package/install.bat
          cp outputs/kurisu_pet/pet.json release-package/kurisu/pet.json
          cp outputs/kurisu_pet/spritesheet.webp release-package/kurisu/spritesheet.webp

          cd release-package
          zip -9 -r "../${ZIP}" install.bat kurisu >/dev/null
          cd ..

          echo "Release package contents:"
          unzip -l "${ZIP}"

          FILES=$(unzip -Z1 "${ZIP}" | grep -v '/$' | sort)
          EXPECTED=$(printf '%s\n' 'install.bat' 'kurisu/pet.json' 'kurisu/spritesheet.webp' | sort)
          if [ "${FILES}" != "${EXPECTED}" ]; then
            echo "Unexpected files found in release package."
            exit 1
          fi

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## Kurisu Codex Pet v1.0.1 — One-click installer

          Windows 用户现在可以一键安装。

          ### 一键安装

          1. 下载 `Kurisu-CodexPet-v1.0.1-OneClick.zip`。
          2. 解压 ZIP。
          3. 双击 `install.bat`。
          4. 安装脚本会自动将 Kurisu 安装到：

             `%USERPROFILE%\.codex\pets\kurisu`

          5. 重启 Codex Desktop，或刷新 Settings 中的 Pets。
          6. 选择 **Kurisu / 牧濑红莉栖**。

          ### 安装包内容

          ZIP 中只有：
          - `install.bat`
          - `kurisu/pet.json`
          - `kurisu/spritesheet.webp`

          不包含 `work/`、`preview/`、`qa/`、`prompts/`、`frames/`、`decoded/` 等开发文件。
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.1"
          ZIP="Kurisu-CodexPet-v1.0.1-OneClick.zip"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ZIP}" --clobber
          else
            gh release create "${TAG}" "${ZIP}" \
              --title "Kurisu Codex Pet v1.0.1 - One-click installer" \
              --notes-file RELEASE_NOTES.md \
              --target "${GITHUB_SHA}"
          fi
